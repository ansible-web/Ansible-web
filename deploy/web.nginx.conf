server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location ~ /\. { deny all; }
  location = /index.html { add_header Cache-Control "no-store" always; }
  location = /version.txt { add_header Cache-Control "no-store" always; }
  location = /build.txt { add_header Cache-Control "no-store" always; }
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
  }
  location ~* "[-.][\w-]{8,64}\.(js|css|wasm|bin|json|png|jpg|jpeg|gif|webp|ico|svg|woff2?|ttf|ass)$" {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location ~* \.(js|css|wasm|bin|json|png|jpg|jpeg|gif|webp|ico|svg|woff2?|ttf|ass)$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
  }
}
